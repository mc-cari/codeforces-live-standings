name: live-v3 backend
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend-live-v3/**'
      - 'vendor/live-v3'
      - '.gitmodules'
      - 'docker-compose.live-v3.yml'
      - '.github/workflows/live-v3.yml'
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend-live-v3/**'
      - 'vendor/live-v3'
      - '.gitmodules'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build and test Kotlin service
        working-directory: backend-live-v3
        run: ./gradlew --no-daemon test installDist
      - name: Test pinned engine and exported APIs
        working-directory: vendor/live-v3
        run: ./gradlew --no-daemon :cds:plugins:codeforces:test :cds:core:test :cds:plugins:codeforces:apiCheck :cds:core:apiCheck
      - name: Test existing Go backend
        working-directory: backend
        run: go test ./... && go build -o /tmp/live-go .
      - name: Same HTTP/SSE assertions against both providers
        run: python3 backend-live-v3/tests/contract.py --go /tmp/live-go
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Browser dependencies
        run: |
          cd frontend && pnpm install --frozen-lockfile
          python3 -m pip install -r ../backend-live-v3/tests/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
      - name: Real frontend with live-v3 SSE
        run: python3 backend-live-v3/tests/run-browser.py
      - name: JVM 17 container build
        run: docker build -f backend-live-v3/Dockerfile -t live-v3-backend:test .
