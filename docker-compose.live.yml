services:
  live-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      DATA_DIR: /data
      LISTEN_ADDR: :8080
      METRICS_LISTEN_ADDR: :9090
      ADMIN_LISTEN_ADDR: :8081
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUDIENCE: ${CF_ACCESS_AUDIENCE:-}
      TELEMETRY_TOKEN: ${TELEMETRY_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://codeforces-live-standings.mccari.us,https://codeforces-live-standings-*-mccaris-projects.vercel.app}
      CF_API_BASE_URL: ${CF_API_BASE_URL:-https://codeforces.com/api/}
    volumes:
      - ${LIVE_DATA_DIR:-./.live-data}:/data
    networks: [live]
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [live-backend]
    networks: [live]

  cloudflared-admin:
    image: cloudflare/cloudflared:latest
    profiles: [admin]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_ADMIN_TUNNEL_TOKEN:-}
    depends_on: [live-backend]
    networks: [live]

networks:
  live:
