<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go live standings backend</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f5f5f5; color: #2d3142; font-family: 'Geist', sans-serif; }
    main { max-width: 1280px; margin: 0 auto; }
    .eyebrow { color: #4f5d75; font: 500 12px 'Geist Mono', monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0; font: 400 28px 'Instrument Serif', serif; }
    p { margin: 0 0 16px; color: #4f5d75; font-size: 16px; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Go backend · live standings data path</div>
  <h1>Go live standings backend</h1>
  <p>The Go service polls Codeforces, builds standings, and serves HTTP/SSE and telemetry.</p>
  <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="go-backend-architecture-title go-backend-architecture-desc">
    <title id="go-backend-architecture-title">Go live standings backend</title>
    <desc id="go-backend-architecture-desc">The frontend calls Go, which serves HTTP and SSE, polls Codeforces, builds participant standings, and persists submissions, contests, and telemetry in SQLite.</desc>
    <defs><marker id="go-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker></defs>
    <rect width="1280" height="720" fill="#f5f5f5"/>
    <text x="48" y="56" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">GO BACKEND · LIVE STANDINGS</text>
    <text x="48" y="100" fill="#2d3142" font-family="'Instrument Serif',serif" font-size="30">Go live standings backend</text>
    <text x="48" y="132" fill="#4f5d75" font-family="'Geist',sans-serif" font-size="16">One Go service owns the API, polling, projections, and storage.</text>
    <path d="M216 320 H248" fill="none" stroke="#4f5d75" marker-end="url(#go-arrow)"/>
    <path d="M440 320 H480" fill="none" stroke="#4f5d75" marker-end="url(#go-arrow)"/>
    <path d="M672 320 H712" fill="none" stroke="#4f5d75" marker-end="url(#go-arrow)"/>
    <path d="M904 320 H944" fill="none" stroke="#4f5d75" marker-end="url(#go-arrow)"/>
    <path d="M576 368 V488" fill="none" stroke="#4f5d75" marker-end="url(#go-arrow)"/>
    <rect x="40" y="280" width="176" height="80" rx="6" fill="#fff" stroke="#7a8399"/>
    <text x="128" y="312" text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif" font-size="16" font-weight="600">Frontend</text>
    <text x="128" y="336" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">HTTP · SSE</text>
    <rect x="248" y="280" width="192" height="80" rx="6" fill="#fff" stroke="#7a8399"/>
    <text x="344" y="312" text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif" font-size="16" font-weight="600">Go HTTP API</text>
    <text x="344" y="336" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">activation · SSE</text>
    <rect x="480" y="272" width="192" height="96" rx="6" fill="#fce9e0" stroke="#eb6c36"/>
    <text x="576" y="308" text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif" font-size="16" font-weight="600">Standings manager</text>
    <text x="576" y="332" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">poll · score · project</text>
    <text x="576" y="352" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">participant views</text>
    <rect x="712" y="280" width="192" height="80" rx="6" fill="#fff" stroke="#7a8399"/>
    <text x="808" y="312" text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif" font-size="16" font-weight="600">Codeforces client</text>
    <text x="808" y="336" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">2.1s shared pacing</text>
    <rect x="944" y="280" width="240" height="80" rx="6" fill="#fff" stroke="#7a8399"/>
    <text x="1064" y="312" text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif" font-size="16" font-weight="600">Codeforces API</text>
    <text x="1064" y="336" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">status · standings</text>
    <rect x="480" y="488" width="192" height="96" rx="6" fill="#fce9e0" stroke="#eb6c36"/>
    <text x="576" y="524" text-anchor="middle" fill="#2d3142" font-family="'Geist',sans-serif" font-size="16" font-weight="600">Go SQLite</text>
    <text x="576" y="548" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">submissions · contests</text>
    <text x="576" y="568" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">telemetry totals</text>
    <text x="48" y="648" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">The ICPC Live fork is maintained separately from this application.</text>
  </svg>
</main>

</html>
