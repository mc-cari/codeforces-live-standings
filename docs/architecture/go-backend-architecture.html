<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go live standings backend</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f5f5f5; color: #2d3142; font-family: 'Geist', sans-serif; }
    main { max-width: 1280px; margin: 0 auto; }
    .eyebrow { color: #4f5d75; font: 500 12px 'Geist Mono', monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0; font: 400 28px 'Instrument Serif', serif; }
    p { margin: 0 0 16px; color: #4f5d75; font-size: 16px; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">Go backend · provider boundary and data paths</div>
  <h1>One public API, two interchangeable standings engines</h1>
  <p>The Go service owns HTTP/SSE and telemetry. By default it runs its native poller; setting <code>LIVE_V3_ENGINE_URL</code> selects the private Kotlin engine.</p>
  <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="go-backend-architecture-title go-backend-architecture-desc">
    <title id="go-backend-architecture-title">Go live standings API and provider architecture</title>
    <desc id="go-backend-architecture-desc">The frontend calls the Go HTTP and SSE API. A provider interface routes requests to either the native Go manager, which polls Codeforces and persists parsed submissions in Go SQLite, or a private live-v3 client, whose Kotlin service owns separate raw-history storage. The Go database also stores telemetry totals.</desc>
    <defs>
      <marker id="go-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker>
      <marker id="go-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="1280" height="720" fill="#f5f5f5"/>

    <!-- Go runtime boundary -->
    <rect x="208" y="144" width="704" height="504" rx="8" fill="#ececec" stroke="#bfc0c0"/>
    <rect x="232" y="148" width="216" height="20" rx="2" fill="#ececec"/>
    <text x="240" y="164" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12" letter-spacing="1.5">GO SERVICE · PUBLIC :8080</text>

    <!-- Connectors are drawn before nodes. -->
    <path d="M216 240 H168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#go-arrow)"/>
    <path d="M168 272 H216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#go-arrow)"/>
    <path d="M416 264 H472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#go-arrow)"/>
    <path d="M664 240 H720" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#go-link)"/>
    <path d="M896 240 H952" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#go-link)"/>
    <path d="M568 280 V400" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#go-arrow)"/>
    <path d="M664 444 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#go-arrow)"/>
    <path d="M896 444 H952" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#go-link)"/>
    <path d="M536 488 V544" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#go-arrow)"/>
    <path d="M600 544 V488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#go-arrow)"/>
    <path d="M324 304 V344 Q324 352 332 352 H440 Q448 352 448 360 V520 Q448 528 456 528 H528 Q536 528 536 536 V544" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#go-arrow)"/>

    <!-- Nodes -->
    <g font-family="'Geist',sans-serif" text-anchor="middle">
      <rect x="40" y="224" width="128" height="80" rx="6" fill="#ffffff" stroke="#7a8399"/>
      <text x="104" y="256" fill="#2d3142" font-size="16" font-weight="600">Frontend</text>
      <text x="104" y="280" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">browser</text>

      <rect x="216" y="224" width="200" height="80" rx="6" fill="#ffffff" stroke="#7a8399"/>
      <text x="316" y="256" fill="#2d3142" font-size="16" font-weight="600">HTTP / SSE API</text>
      <text x="316" y="280" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">POST · SSE · telemetry</text>

      <rect x="472" y="200" width="192" height="80" rx="6" fill="#fce9e0" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="568" y="232" fill="#2d3142" font-size="16" font-weight="600">Provider interface</text>
      <text x="568" y="256" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">LiveStandingsProvider</text>

      <rect x="720" y="200" width="176" height="80" rx="6" fill="#ffffff" stroke="#7a8399"/>
      <text x="808" y="232" fill="#2d3142" font-size="16" font-weight="600">live-v3 client</text>
      <text x="808" y="256" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">private HTTP bridge</text>

      <rect x="952" y="176" width="288" height="128" rx="6" fill="#ffffff" stroke="#7a8399"/>
      <text x="1096" y="212" fill="#2d3142" font-size="20" font-weight="600">Kotlin live-v3 service</text>
      <text x="1096" y="240" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">engine + scoring + ranking</text>
      <text x="1096" y="264" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">owns separate raw-history SQLite</text>

      <rect x="472" y="400" width="192" height="88" rx="6" fill="#ffffff" stroke="#7a8399"/>
      <text x="568" y="432" fill="#2d3142" font-size="16" font-weight="600">Native Go manager</text>
      <text x="568" y="456" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">contest sessions · polling</text>
      <text x="568" y="472" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">scores · friend rows</text>

      <rect x="720" y="400" width="176" height="88" rx="6" fill="#ffffff" stroke="#7a8399"/>
      <text x="808" y="432" fill="#2d3142" font-size="16" font-weight="600">Codeforces client</text>
      <text x="808" y="456" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">status + standings</text>
      <text x="808" y="472" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">2.1s shared pacing</text>

      <rect x="952" y="400" width="288" height="88" rx="6" fill="#ffffff" stroke="#7a8399"/>
      <text x="1096" y="432" fill="#2d3142" font-size="16" font-weight="600">Codeforces API</text>
      <text x="1096" y="456" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">contest.status · contest.standings</text>

      <rect x="472" y="544" width="192" height="88" rx="6" fill="#fce9e0" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="568" y="576" fill="#2d3142" font-size="16" font-weight="600">Go SQLite · live.sqlite</text>
      <text x="568" y="600" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">submissions · contests</text>
      <text x="568" y="616" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">telemetry totals always</text>
    </g>

    <text x="40" y="680" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">Default uses Go history in SQLite; LIVE_V3_ENGINE_URL selects Kotlin, which owns its own raw history.</text>
  </svg>
</main>
</body>
</html>
