<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live standings provider architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f5f5f5; color: #2d3142; font-family: 'Geist', sans-serif; }
    main { max-width: 1280px; margin: 0 auto; }
    .eyebrow { color: #2e5aa8; font: 500 12px 'Geist Mono', monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0; font: 400 28px 'Instrument Serif', serif; letter-spacing: .01em; }
    p { margin: 0 0 16px; color: #4f5d75; font-size: 16px; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">System architecture · provider overview</div>
  <h1>Go API, interchangeable standings engines</h1>
  <p>Go owns the public API. Its application port selects native Go standings or a client for the private live-v3 engine.</p>
  <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="live-v3-architecture-title live-v3-architecture-desc">
    <title id="live-v3-architecture-title">Go compatibility layer with interchangeable engines</title>
    <desc id="live-v3-architecture-desc">The Go HTTP and SSE API consumes an application-owned standings port implemented by the native manager or a client for the private Kotlin engine. Each engine owns its history.</desc>
    <defs>
      <marker id="overview-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#4f5d75"/></marker>
      <marker id="overview-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#2e5aa8"/></marker>
    </defs>
    <rect width="1280" height="720" fill="#f5f5f5"/>
    <!-- provider zones -->
    <rect x="240" y="128" width="440" height="216" rx="8" fill="#ececec" stroke="#bfc0c0"/>
    <rect x="240" y="376" width="440" height="216" rx="8" fill="#ececec" stroke="#bfc0c0"/>
    <text x="260" y="156" fill="#2e5aa8" font-family="'Geist Mono',monospace" font-size="12" letter-spacing="1.5">NATIVE GO ENGINE</text>
    <text x="260" y="404" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12" letter-spacing="1.5">KOTLIN / LIVE-V3 ENGINE (PRIVATE)</text>

    <!-- connectors, behind nodes -->
    <path d="M184 336 H208 Q216 336 216 328 V232 Q216 224 224 224 H264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/>
    <path d="M184 368 H208 Q216 368 216 376 V472 Q216 480 224 480 H264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/>
    <path d="M408 224 H456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/>
    <path d="M552 264 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/>
    <path d="M408 480 H456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/>
    <path d="M552 520 V544" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/>
    <path d="M648 224 H708 Q716 224 716 232 V320 Q716 328 724 328 H760" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#overview-blue)"/>
    <path d="M648 480 H708 Q716 480 716 472 V416 Q716 408 724 408 H760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#overview-arrow)"/>
    <path d="M952 368 H1000" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#overview-blue)"/>

    <!-- nodes -->
    <g font-family="'Geist',sans-serif" text-anchor="middle">
      <rect x="40" y="320" width="144" height="64" rx="6" fill="#ffffff" stroke="#7a8399"/>
      <text x="112" y="348" fill="#2d3142" font-size="16" font-weight="600">Codeforces API</text>
      <text x="112" y="368" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">Codeforces data</text>

      <rect x="264" y="184" width="144" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
      <text x="336" y="216" fill="#2d3142" font-size="16" font-weight="600">Go backend</text>
      <text x="336" y="240" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">fetch + parse</text>
      <rect x="456" y="184" width="192" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
      <text x="552" y="212" fill="#2d3142" font-size="16" font-weight="600">Sessions + scoring</text>
      <text x="552" y="236" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">merge retained submissions</text>
      <text x="552" y="252" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">friend projections</text>
      <rect x="456" y="288" width="192" height="56" rx="6" fill="#fce9e0" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="552" y="312" fill="#2d3142" font-size="16" font-weight="600">Go SQLite</text>
      <text x="552" y="332" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">submissions · contests</text>

      <rect x="264" y="440" width="144" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
      <text x="336" y="472" fill="#2d3142" font-size="16" font-weight="600">live-v3</text>
      <text x="336" y="496" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">source + engine</text>
      <rect x="456" y="440" width="192" height="80" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
      <text x="552" y="472" fill="#2d3142" font-size="16" font-weight="600">Internal view API</text>
      <text x="552" y="496" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">JSON views · long polling</text>
      <rect x="456" y="544" width="192" height="48" rx="6" fill="#ececec" stroke="#7a8399"/>
      <text x="552" y="568" fill="#2d3142" font-size="16" font-weight="600">live-v3 SQLite</text>
      <text x="552" y="584" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">raw history + snapshots</text>

      <rect x="760" y="288" width="192" height="160" rx="6" fill="#ececec" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="856" y="328" fill="#2d3142" font-size="20" font-weight="600">Go HTTP / SSE API</text>
      <text x="856" y="360" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">LiveStandingsProvider</text>
      <text x="856" y="384" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">snapshot · patch · state</text>
      <text x="856" y="416" fill="#4f5d75" font-size="16">telemetry + CORS</text>

      <rect x="1000" y="320" width="240" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
      <text x="1120" y="356" fill="#2d3142" font-size="20" font-weight="600">Frontend</text>
      <text x="1120" y="384" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">calls the Go public API</text>
    </g>

    <text x="40" y="640" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">Go selects its engine with LIVE_V3_ENGINE_URL. The JVM engine has no public port.</text>
    <text x="40" y="672" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">Each engine keeps its own history. Go owns the public contract and telemetry database.</text>
  </svg>
</main>
</body>
</html>
